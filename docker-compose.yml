version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - '5566:8000'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: bot-coin-frontend
    ports:
      # Host 3001 — avoids conflict with other apps on :3000 (Bot_Trading, Next dev, etc.)
      - '3001:3001'
    environment:
      - INTERNAL_API_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_WS_PORT=5566
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"

volumes:
  frontend_node_modules:
